<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCode Pool</title>
<style>
:root{--bg:#fafafa;--card:#fff;--fg:#111;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--green:#16a34a;--orange:#d97706;--red:#dc2626;--yellow:#ca8a04;--gray:#9ca3af;--hover:#f0f4ff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px clamp(16px,4vw,48px)}
header{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:19px;font-weight:650;letter-spacing:-.01em}
h1 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:8px}
#add{margin-left:auto;border:0;background:var(--accent);color:#fff;font:600 13px inherit;padding:8px 16px;border-radius:8px;cursor:pointer}
#add:hover{filter:brightness(1.08)}
#error{display:none;background:#fef2f2;border:1px solid #fecaca;color:var(--red);border-radius:8px;padding:9px 14px;margin-bottom:16px;font-size:13px;white-space:pre-wrap}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#c7d2fe}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px #dbeafe}
.chead{display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--green)}
.dot.orange{background:var(--orange)}.dot.red{background:var(--red)}.dot.yellow{background:var(--yellow)}.dot.gray{background:var(--gray)}.dot.hollow{background:transparent;border:2px solid var(--gray)}
.aname{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.akey{color:var(--muted);font-size:11.5px;font-family:ui-monospace,Consolas,monospace;margin-left:auto;flex:none}
.wins{margin:13px 0 11px;display:flex;flex-direction:column;gap:7px}
.win{display:grid;grid-template-columns:64px 1fr 76px;align-items:center;gap:10px;font-size:12px}
.win .wn{color:var(--muted)}
.win .bar{height:6px;background:#eef2f7;border-radius:3px;overflow:hidden}
.win .bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.win .wv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:11px;border-top:1px solid var(--line)}
.stat b{display:block;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;color:var(--muted)}
.card .ops{display:flex;gap:4px;margin-top:11px;opacity:0;transition:opacity .15s}
.card:hover .ops,.card:focus-within .ops{opacity:1}
.ops button{border:0;background:none;color:var(--muted);font:12px inherit;cursor:pointer;padding:3px 8px;border-radius:5px}
.ops button:hover{background:var(--hover);color:var(--accent)}
.ops button.danger:hover{color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:56px 0;font-size:14px}
#drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100%;background:var(--card);border-left:1px solid var(--line);transition:right .2s;overflow-y:auto;padding:22px 24px;box-shadow:-8px 0 32px rgba(0,0,0,.05)}
#drawer.open{right:0}
#drawer h2{font-size:16px;font-weight:650;margin-bottom:4px;word-break:break-all}
#drawer .sub{color:var(--muted);font-size:12px;margin-bottom:16px;font-family:ui-monospace,monospace}
dl{display:grid;grid-template-columns:96px 1fr;gap:7px 12px;font-size:13px}
dt{color:var(--muted)}dd{font-variant-numeric:tabular-nums;word-break:break-all}
#drawer .acts{display:flex;gap:8px;margin-top:20px}
#drawer .acts button{flex:1;border:1px solid var(--line);background:var(--card);font:inherit;padding:7px;border-radius:7px;cursor:pointer}
#drawer .acts button:hover{border-color:var(--accent);color:var(--accent)}
#drawer .acts button.danger:hover{border-color:var(--red);color:var(--red)}
#modal{position:fixed;inset:0;background:rgba(17,24,39,.32);display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:22px;width:380px;max-width:92vw}
#modal h3{font-size:15px;font-weight:650;margin-bottom:14px}
#modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
#modal input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:13px ui-monospace,Consolas,monospace}
#modal input:focus{outline:2px solid #bfdbfe;border-color:var(--accent)}
#modal .mrow{display:flex;gap:8px;margin-top:18px}
#modal .mrow button{flex:1;border-radius:8px;padding:9px;font:600 13px inherit;cursor:pointer}
#mok{border:0;background:var(--accent);color:#fff}#mcancel{border:1px solid var(--line);background:var(--card)}
#keybar{display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:10px;padding:10px 14px;gap:8px;align-items:center}
#keybar.show{display:flex}
#keybar input{border:0;border-radius:6px;padding:7px 10px;font:13px ui-monospace,monospace;width:240px}
#keybar button{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:7px 13px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>OpenCode 账号池<small id="sum"></small></h1>
  <button id="add">＋ 添加账号</button>
</header>
<div id="error"></div>
<div id="grid"></div>
<div id="keybar"><input id="key" type="password" placeholder="管理密钥"><button id="connect">连接</button></div>
<div id="drawer"><div id="detail"></div></div>
<div id="modal"><div class="box">
  <h3>添加账号</h3>
  <label>账户名（邮箱）</label><input id="mname" placeholder="user@example.com" autocomplete="off">
  <label>API Key</label><input id="mkey" placeholder="oc_sk_..." autocomplete="off">
  <div class="mrow"><button id="mcancel">取消</button><button id="mok">添加</button></div>
</div></div>
<script>
"use strict";
// JSON 端点挂在管理前缀下（resource 前缀只有 /status 外壳）。
const API="/v0/management/plugins/opencode-pool";
const $=s=>document.querySelector(s);
let sel=null,timer=null,data={accounts:[]};
// CPAMP 登录（勾选记住密码）后密钥存在同源 localStorage["cli-proxy-auth"]，
// 从 CPAMP 打开本页时自动复用，无需再输；仅读不到时才请求输入。
const key=()=>{
  if(localStorage.ocp_key)return localStorage.ocp_key;
  try{
    const a=JSON.parse(localStorage.getItem("cli-proxy-auth")||"");
    const k=a&&a.state&&a.state.managementKey;
    if(typeof k==="string"&&k)return k
  }catch(_){ }
  return ""
};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"—":n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n);
function showErr(msg){const e=$("#error");e.textContent=msg;e.style.display=msg?"block":"none"}
async function api(path,opt={}){
  let r;
  try{r=await fetch(API+path,{...opt,headers:{...opt.headers,"Authorization":"Bearer "+key(),"Content-Type":"application/json"}})}
  catch(err){showErr("网络错误："+err.message+"  "+path);throw 0}
  if(r.status===401){$("#keybar").classList.add("show");$("#key").focus();showErr("需要管理密钥（401）— 输入 CPAMP 的管理密钥；在 CPAMP 登录页勾选「记住密码」后从这里打开可免输");throw 0}
  const text=await r.text();
  if(!r.ok){let m=text;try{m=JSON.parse(text).error?.message||text}catch(_){ }
    showErr("请求失败 "+r.status+" "+path+"\n"+m);throw r}
  showErr("");return JSON.parse(text)
}
function dot(a){
  const w=a.windows||[],ex=w.some(x=>x.used_pct>=100&&new Date(x.until)>new Date());
  if(a.requires_sign_in)return"dot hollow";
  if(ex)return"dot red";
  if(w.some(x=>x.used_pct>=92))return"dot orange";
  if(a.verify_pending)return"dot yellow";
  if(a.enabled===false)return"dot gray";
  return"dot green"
}
function untilTxt(x){if(!x||x.used_pct<100)return x?("重置 "+fmtT(x.until)):"";
  const m=(new Date(x.until)-Date.now())/6e4;return m<=0?"即将重置":m<60?Math.ceil(m)+"m 后重置":Math.floor(m/60)+"h"+Math.ceil(m%60)+"m 后重置"}
function fmtT(s){if(!s)return"—";const d=new Date(s);return d.toLocaleString()}
function winRow(w){
  const p=Math.min(w.used_pct??0,100),c=p>=100?"var(--red)":p>=92?"var(--orange)":"var(--accent)";
  return`<div class="win"><span class="wn">${esc(w.window)}</span>
  <span class="bar"><i style="width:${p}%;background:${c}"></i></span>
  <span class="wv">${p>=100?"满":(w.used_pct??0).toFixed(0)+"%"} · ${untilTxt(w)}</span></div>`
}
function render(){
  const g=$("#grid");g.innerHTML="";
  const acc=data.accounts||[];
  $("#sum").textContent=acc.length?`${acc.length} 个账号 · ${acc.filter(a=>a.enabled!==false&&dot(a)==="dot green").length} 可用`:"";
  if(!acc.length){g.innerHTML='<div class="empty">'+(key()?"没有账号 — 点右上角添加":"需要管理密钥 — 在下方输入后连接")+"</div>";return}
  for(const a of acc){
    const d=document.createElement("div");
    d.className="card"+(sel===a.id?" sel":"");d.dataset.id=a.id;d.tabIndex=0;
    const wins=(a.windows&&a.windows.length)?a.windows.map(winRow).join(""):'<div class="win"><span class="wn">用量</span><span></span><span class="wv">暂无数据</span></div>';
    d.innerHTML=`<div class="chead"><span class="${dot(a)}"></span><span class="aname">${esc(a.label||a.id)}</span><span class="akey">${esc(a.api_key_masked||"")}</span></div>
    <div class="wins">${wins}</div>
    <div class="stats">
      <div class="stat"><b>${a.inflight??0}/${a.learned_concurrency_limit||"–"}</b><span>并发</span></div>
      <div class="stat"><b>${fmt(a.usage?.requests)}</b><span>请求</span></div>
      <div class="stat"><b>${fmt(a.usage?.input_tokens)}</b><span>输入 tok</span></div>
      <div class="stat"><b>${fmt(a.usage?.output_tokens)}</b><span>输出 tok</span></div>
    </div>
    <div class="ops"><button data-a="r">刷新</button><button data-a="u">恢复</button><button data-a="e">${a.enabled===false?"启用":"停用"}</button><button data-a="x" class="danger">删除</button></div>`;
    d.onclick=e=>{const b=e.target.closest("button");
      if(b){act(a,b.dataset.a,e);e.stopPropagation();return}
      sel=sel===a.id?null:a.id;render();if(sel)drawer(a)};
    g.appendChild(d)
  }
}
async function drawer(a){
  $("#detail").innerHTML="<h2>"+esc(a.label||a.id)+"</h2>";$("#drawer").classList.add("open");
  let full=a;try{full=await api("/account?id="+encodeURIComponent(a.id))}catch(_){ }
  const ws=(full.windows||[]).map(w=>`<dt>${esc(w.window)}</dt><dd>${(w.used_pct??0).toFixed(0)}% · 重置 ${fmtT(w.until)} · 来源 ${esc(w.source)}</dd>`).join("");
  $("#detail").innerHTML=`<h2>${esc(full.label||full.id)}</h2><div class="sub">${esc(full.id)}<br>${esc(full.api_key_masked||"")}</div>
  <dl>
    <dt>状态</dt><dd>${esc(full.status)}${full.enabled===false?"（已停用）":""}</dd>
    ${ws}
    <dt>并发</dt><dd>${full.inflight??0} / 上限 ${full.learned_concurrency_limit||"未学习"}</dd>
    <dt>请求数</dt><dd>${fmt(full.usage?.requests)}</dd>
    <dt>输入</dt><dd>${fmt(full.usage?.input_tokens)}</dd>
    <dt>输出</dt><dd>${fmt(full.usage?.output_tokens)}</dd>
    <dt>最近使用</dt><dd>${fmtT(full.usage?.last_used_at)}</dd>
    <dt>会话绑定</dt><dd>${full.bindings_count??0}</dd>
    <dt>最近错误</dt><dd>${full.last_error?esc(full.last_error.code)+" · "+fmtT(full.last_error.at):"—"}</dd>
  </dl>
  <div class="acts"><button data-a="r">刷新</button><button data-a="u">恢复</button><button data-a="b">解绑</button><button data-a="x" class="danger">删除</button></div>`;
  $("#detail").querySelectorAll("button").forEach(b=>b.onclick=e=>act(full,b.dataset.a,e,true))
}
async function act(a,action,e,fromDrawer){
  e&&e.stopPropagation();
  try{
    if(action==="r"){await api("/account/refresh",{method:"POST",body:JSON.stringify({id:a.id})})}
    if(action==="u"){await api("/account/unblock",{method:"POST",body:JSON.stringify({id:a.id})})}
    if(action==="b"){await api("/account/bindings/clear",{method:"POST",body:JSON.stringify({id:a.id})})}
    if(action==="e"){await api("/account",{method:"PATCH",body:JSON.stringify({id:a.id,enabled:a.enabled===false})})}
    if(action==="x"){
      if(e&&e.shiftKey){await api("/account?id="+encodeURIComponent(a.id)+"&purge=true",{method:"DELETE"})}
      else{await api("/account?id="+encodeURIComponent(a.id),{method:"DELETE"})}
      sel=null;$("#drawer").classList.remove("open")
    }
    await load()
  }catch(_){/* 错误已由 api() 显示 */}
}
async function load(){try{data=await api("/accounts")}catch(_){ }render()}
function loop(){if(timer)clearInterval(timer);(async()=>{await load()})();timer=setInterval(load,5000)}
$("#connect").onclick=()=>{localStorage.ocp_key=$("#key").value;$("#keybar").classList.remove("show");loop()};
$("#add").onclick=()=>{$("#modal").classList.add("open");$("#mname").focus()};
$("#mcancel").onclick=()=>$("#modal").classList.remove("open");
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("open")};
$("#mok").onclick=async()=>{
  const n=$("#mname").value.trim(),k=$("#mkey").value.trim();
  if(!k){showErr("API Key 不能为空");return}
  try{
    await api("/accounts",{method:"POST",body:JSON.stringify({name:n,api_key:k})});
    $("#modal").classList.remove("open");$("#mname").value="";$("#mkey").value="";await load()
  }catch(_){/* 错误已显示，模态框保持打开让用户重试 */}
};
document.onkeydown=e=>{
  if($("#modal").classList.contains("open")){if(e.key==="Escape")$("#modal").classList.remove("open");if(e.key==="Enter")$("#mok").click();return}
  if(e.target.tagName==="INPUT")return;
  if(e.key==="Escape"){$("#drawer").classList.remove("open");return}
  const cards=[...document.querySelectorAll(".card")];if(!cards.length)return;
  const i=cards.findIndex(c=>c.classList.contains("sel"));
  const n=e.key==="j"?(i<0?0:i+1):e.key==="k"?(i<0?0:i-1):i;
  if(e.key==="j"||e.key==="k"){cards[Math.min(Math.max(n,0),cards.length-1)].click();e.preventDefault();return}
  if(i>=0){const a=data.accounts.find(x=>x.id===cards[i].dataset.id);if(!a)return;
    if(e.key==="e")act(a,"e");if(e.key==="r")act(a,"r");if(e.key==="u")act(a,"u");
    if(e.key==="x")act(a,"x");if(e.key==="Enter")cards[i].click()}
};
loop();
</script>
</body>
</html>
