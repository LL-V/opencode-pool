<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenCode 账号池</title>
<style>
:root{
  color-scheme:light;
  --canvas:#f6f5f2;--surface:#fff;--sunken:#f2f1ee;--line:#e7e6e1;--line-2:#d3d2cc;
  --text:#16191c;--muted:#565c63;--faint:#7a8188;
  --ok:#1a6b3f;--ok-bg:#e7f3ec;--warn:#8a5f12;--warn-bg:#f8f0de;
  --danger:#c73a3a;--danger-bg:#fbeceb;--info:#1c4f6e;--info-bg:#e9eff5;
  --neutral:#5c6167;--neutral-bg:#eeeef0;--accent:#2f6fed;--accent-bg:#eef3fe;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --r-card:10px;--r-ctrl:7px;--r-badge:6px;
  --shadow:0 1px 2px rgba(28,26,20,.04),0 4px 14px rgba(28,26,20,.05);
}
*{box-sizing:border-box;margin:0}
body{background:var(--canvas);color:var(--text);font:13px/1.5 var(--sans);padding:24px clamp(14px,3.2vw,40px) 56px}
b,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* 顶栏 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-badge);padding:3px 9px;font-size:11px;color:var(--muted)}
.pill b{font-size:14px;font-weight:650;color:var(--text)}
.pill b.ok{color:var(--ok)} .pill b.warn{color:var(--warn)} .pill b.danger{color:var(--danger)}
#add{margin-left:auto;border:0;background:var(--accent);color:#fff;font:600 12px var(--sans);padding:7px 14px;border-radius:var(--r-ctrl);cursor:pointer}
#add:hover{filter:brightness(1.07)}
/* 错误 / 密钥条 */
#err{display:none;background:var(--danger-bg);border:1px solid #f2d3d1;color:var(--danger);border-radius:var(--r-ctrl);padding:8px 12px;margin-bottom:12px;font-size:12px;white-space:pre-wrap}
#keybar{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#14171a;color:#fff;border-radius:10px;padding:9px 12px;gap:8px;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#keybar.show{display:flex}
#keybar input{border:0;border-radius:6px;padding:6px 9px;font:12px var(--mono);width:240px}
#keybar button{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:6px 12px;font:600 12px var(--sans);cursor:pointer}
/* 卡片网格——330px 起始，宽屏 4 列 */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:10px;align-items:start}
.acct{position:relative;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:var(--r-card);box-shadow:var(--shadow);padding:11px 13px 10px;transition:border-color 140ms;min-width:0}
.acct[data-tone=warn]{border-left-color:var(--warn)}
.acct[data-tone=danger]{border-left-color:var(--danger)}
.acct[data-tone=neutral]{border-left-color:var(--neutral);box-shadow:none}
.acct[data-tone=neutral] .quotas,.acct[data-tone=neutral] .stats{opacity:.7}
.acct.sel{outline:2px solid var(--accent);outline-offset:1px}
/* 头部两行：名称+操作 / key+徽章 */
.h1row{display:flex;align-items:center;gap:6px;min-width:0}
.acct-name{font:650 12.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.acts{display:flex;gap:1px;flex:none}
.acts button{border:0;background:none;color:var(--faint);font:11px var(--sans);cursor:pointer;padding:3px 6px;border-radius:5px;white-space:nowrap}
.acts button:hover{background:var(--sunken);color:var(--accent)}
.acts button.del:hover{color:var(--danger)}
.h2row{display:flex;align-items:center;gap:8px;margin-top:4px;min-width:0}
.acct-key{font:10.5px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:5px;flex:none;min-height:20px;padding:1px 7px;border-radius:var(--r-badge);font-size:10.5px;font-weight:600;background:var(--neutral-bg);color:var(--text);white-space:nowrap}
.badge i{width:5px;height:5px;border-radius:50%;flex:none;background:currentColor}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.info{background:var(--info-bg);color:var(--info)}
/* 额度行 30px 固定 */
.quotas{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.q{position:relative;height:30px;border-radius:5px;background:var(--sunken);padding:0 9px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;overflow:hidden}
.q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--q-accent,#c9cdd2)}
.q .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--q-accent,#c9cdd2);transition:width 140ms ease}
.q-name{font-size:11px;font-weight:600;color:var(--muted);position:relative;white-space:nowrap}
.q-meta{position:relative;font-size:10.5px;color:var(--muted);display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.q-meta b{font-size:11.5px;font-weight:650;color:var(--text)}
.q[data-tone=ok]{--q-accent:var(--ok)} .q[data-tone=warn]{--q-accent:var(--warn)} .q[data-tone=danger]{--q-accent:var(--danger)}
.q[data-tone=danger] .q-meta{color:var(--danger)}
.q.na .q-meta{color:var(--faint)} .q.na .q-meta b{font-weight:500;color:var(--faint)}
/* 统计 2×2 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:6px;min-width:0}
.stat span{font-size:10.5px;color:var(--faint);white-space:nowrap}
.stat b{font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
/* 展开 */
details.more{margin-top:7px}
details.more summary{cursor:pointer;font-size:10.5px;color:var(--faint);list-style:none;user-select:none}
details.more summary::before{content:"▸ "} details.more[open] summary::before{content:"▾ "}
.more-box{background:var(--sunken);border-radius:5px;padding:8px 10px;margin-top:5px}
.more-box dl{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.more-box dt{font-size:9.5px;color:var(--faint)}
.more-box dd{font:10.5px var(--mono);font-variant-numeric:tabular-nums;word-break:break-all;margin-top:1px}
/* 整页空态（类名独立，避免与额度行冲突） */
.grid-empty{grid-column:1/-1;text-align:center;padding:56px 0;color:var(--muted)}
.grid-empty h2{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.grid-empty div{font-size:12px}
/* 模态框 */
#modal{position:fixed;inset:0;background:rgba(22,25,28,.34);display:none;align-items:center;justify-content:center;z-index:10}
#modal.open{display:flex}
#modal .box{background:var(--surface);border-radius:12px;padding:20px;width:372px;max-width:92vw;box-shadow:var(--shadow)}
#modal h3{font-size:14px;font-weight:650;margin-bottom:4px}
#modal p{font-size:11px;color:var(--muted);margin-bottom:6px}
#modal label{display:block;font-size:11px;color:var(--muted);margin:11px 0 4px}
#modal input{width:100%;border:1px solid var(--line-2);border-radius:var(--r-ctrl);padding:8px 10px;font:12px var(--mono);background:var(--surface)}
#modal input:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
#modal .row{display:flex;gap:8px;margin-top:16px}
#modal .row button{flex:1;border-radius:var(--r-ctrl);padding:8px;font:600 12px var(--sans);cursor:pointer}
#mok{border:0;background:var(--accent);color:#fff}#mca{border:1px solid var(--line-2);background:var(--surface)}
</style>
</head>
<body>
<div class="top">
  <h1>OpenCode 账号池</h1>
  <div class="pills" id="pills"></div>
  <button id="add">＋ 添加账号</button>
</div>
<div id="err"></div>
<div id="grid"></div>
<div id="keybar"><input id="key" type="password" placeholder="管理密钥"><button id="conn">连接</button></div>
<div id="modal"><div class="box">
  <h3>添加账号</h3><p>上游使用 OpenCode Zen 订阅网关，填邮箱与 API Key。</p>
  <label>账户名（邮箱）</label><input id="mname" placeholder="user@example.com" autocomplete="off">
  <label>API Key</label><input id="mkey" placeholder="oc_sk_…" autocomplete="off">
  <div class="row"><button id="mca">取消</button><button id="mok">添加</button></div>
</div></div>
<script>
"use strict";
const API="/v0/management/plugins/opencode-pool";
const $=s=>document.querySelector(s);
let sel=null,timer=null,data={accounts:[]};
let lastJson="",lastRenderAt=0;const openIds=new Set();
function readAuthKey(){
  for(const st of [localStorage,sessionStorage]){
    try{const raw=st.getItem("cli-proxy-auth")||"";if(!raw||raw.startsWith("enc::"))continue;
      const a=JSON.parse(raw);const k=a&&a.state&&a.state.managementKey;
      if(typeof k==="string"&&k)return k}catch(_){}
  }
  return"";
}
const key=()=>localStorage.ocp_key||readAuthKey();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"—":n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":String(n);
function showErr(m){const e=$("#err");e.textContent=m;e.style.display=m?"block":"none"}
function stopLoop(){if(timer){clearInterval(timer);timer=null}}
async function api(p,o={}){
  const k=key();
  if(!k){stopLoop();$("#keybar").classList.add("show");showErr("请输入管理密钥后连接；CPAMP 登录勾选「记住密码」可自动读取");throw 0}
  let r;try{r=await fetch(API+p,{...o,headers:{...o.headers,"Authorization":"Bearer "+k,"Content-Type":"application/json"}})}
  catch(e){showErr("网络错误："+e.message+"  "+p);throw 0}
  if(r.status===401||r.status===403){
    // 宿主连续 5 次鉴权失败会封 IP 30 分钟：立刻停止轮询，等用户输入。
    stopLoop();$("#keybar").classList.add("show");
    if(document.activeElement!==$("#key"))$("#key").focus();
    showErr("管理密钥无效或已失效（"+r.status+"）— 输入正确密钥后点「连接」；请勿反复自动重试");
    throw 0;
  }
  const t=await r.text();
  if(!r.ok){let m=t;try{m=JSON.parse(t).error?.message||t}catch(_){}
    if(r.status===502&&/connection refused|dial tcp/i.test(m))
      m="管理端不可达（"+m+"）\n请检查 CPAMP 里配置的 CPA 地址和端口，CPA 需要正在运行。";
    showErr("请求失败 "+r.status+"  "+p+"\n"+m);throw r}
  let d;try{d=JSON.parse(t)}catch(_){showErr("管理端返回了非 JSON 响应："+t.slice(0,200));throw 0}
  showErr("");return d
}
function state(a){
  // 以后端 status 为准（阈值 near_limit_threshold_pct 可配）；仅旧服务端/加载中回退本地判断。
  const w=a.windows||[],now=Date.now();
  switch(a.status){
    case"disabled":return{k:"neutral",t:"已停用"};
    case"exhausted":{const ex=w.find(x=>x.used_pct>=100&&new Date(x.until)>now);
      return{k:"danger",t:"额度用尽"+(ex?" · "+rel(ex.until):"")}}
    case"sign_in_required":return{k:"danger",t:"需重新登录"};
    case"verify_pending":return{k:"warn",t:"待验证"};
    case"near_limit":return{k:"warn",t:"接近限额"};
    case"active":return{k:"ok",t:"可用"};
  }
  if(a.enabled===false)return{k:"neutral",t:"已停用"};
  const ex=w.find(x=>x.used_pct>=100&&new Date(x.until)>now);
  if(ex)return{k:"danger",t:"额度用尽 · "+rel(ex.until)};
  if(a.requires_sign_in)return{k:"danger",t:"需重新登录"};
  if(a.verify_pending)return{k:"warn",t:"待验证"};
  if(w.some(x=>x.used_pct>=92&&new Date(x.until)>now))return{k:"warn",t:"接近限额"};
  return{k:"ok",t:"可用"}
}
function rel(iso){if(!iso)return"—";const m=(new Date(iso)-Date.now())/6e4;
  if(m<=0)return"即将重置";if(m<60)return Math.ceil(m)+"m";if(m<1440)return(m/60).toFixed(1)+"h";return(m/1440).toFixed(1)+"d"}
const SLOTS=[["rolling","5 小时"],["weekly","周限额"],["monthly","月限额"]];
function quotaRows(a){
  const m={};(a.windows||[]).forEach(w=>m[w.window]=w);
  return SLOTS.map(([k,name])=>{
    const w=m[k];
    if(!w||w.used_pct==null)
      return`<div class="q na" title="尚未获取用量数据（产生请求或点击恢复后自动获取）"><span class="q-name">${name}</span><span class="q-meta"><b>—</b></span></div>`;
    const left=Math.max(0,100-w.used_pct),used=Math.min(w.used_pct,100);
    const blocked=w.used_pct>=100&&new Date(w.until)>new Date();
    const tone=blocked?"danger":left<30?"danger":left<=70?"warn":"ok";
    const meta=blocked
      ?`<span>阻断 · ${rel(w.until)} 后重置</span>`
      :`<b>剩余 ${Math.round(left)}%</b><span>${rel(w.until)} 后重置</span>`;
    /* 填充线=剩余（满绿=安全，短红=危险） */
    return`<div class="q" data-tone="${tone}" title="已用 ${w.used_pct.toFixed(1)}% · 重置 ${w.until?new Date(w.until).toLocaleString():"—"} · 来源 ${esc(w.source||"")}">
      <span class="q-name">${name}</span><span class="q-meta">${meta}</span>
      <span class="fill" style="width:${left}%"></span></div>`
  }).join("")
}
function render(){
  const g=$("#grid");
  // 保留用户已展开的详情（整表重建会折叠 details）
  g.querySelectorAll(".acct").forEach(c=>{const d=c.querySelector("details.more");if(d&&d.open)openIds.add(c.dataset.id)});
  g.innerHTML="";
  const acc=[...(data.accounts||[])].sort((a,b)=>(a.label||a.id).localeCompare(b.label||b.id)||a.id.localeCompare(b.id));
  const cnt={ok:0,warn:0,danger:0,off:0};
  acc.forEach(a=>{const s=state(a);if(s.k==="ok")cnt.ok++;else if(s.k==="neutral")cnt.off++;else if(s.k==="danger")cnt.danger++;else cnt.warn++});
  $("#pills").innerHTML=`<span class="pill"><b>${acc.length}</b> 个账号</span>
    <span class="pill"><b class="ok">${cnt.ok}</b> 可用</span>
    ${cnt.warn?`<span class="pill"><b class="warn">${cnt.warn}</b> 受限</span>`:""}
    ${cnt.danger?`<span class="pill"><b class="danger">${cnt.danger}</b> 异常</span>`:""}
    ${cnt.off?`<span class="pill"><b>${cnt.off}</b> 停用</span>`:""}`;
  if(!acc.length){g.innerHTML=`<div class="grid-empty"><h2>${key()?"还没有账号":"需要管理密钥"}</h2><div>${key()?"添加账号后即可开始路由请求":"在下方输入 CPAMP 管理密钥后连接"}</div></div>`;return}
  for(const a of acc){
    const s=state(a),tone=s.k==="neutral"?"neutral":s.k;
    const el=document.createElement("article");
    el.className="acct"+(sel===a.id?" sel":"");el.dataset.id=a.id;el.dataset.tone=tone;el.tabIndex=0;
    const u=a.usage||{};
    el.innerHTML=`
    <div class="h1row">
      <span class="acct-name" title="${esc(a.label||a.id)}">${esc(a.label||a.id)}</span>
      <span class="acts">
        <button data-a="e" title="${a.enabled===false?"启用":"停用"}">${a.enabled===false?"启用":"停用"}</button>
        <button data-a="u" title="解除阻断/恢复">恢复</button>
        <button data-a="x" class="del" title="删除">删除</button>
      </span>
    </div>
    <div class="h2row">
      <span class="acct-key">${esc(a.api_key_masked||"")}</span>
      <span class="badge ${s.k}"><i></i>${s.t}</span>
    </div>
    <div class="quotas">${quotaRows(a)}</div>
    <div class="stats">
      <div class="stat"><span>请求</span><b>${fmt(u.requests)}</b></div>
      <div class="stat" title="${a.learned_concurrency_limit?"已学习并发上限 "+a.learned_concurrency_limit:"尚未学习，按默认上限 20 控制"}"><span>并发</span><b>${a.inflight??0}<span style="color:var(--faint);font-weight:400">/${a.learned_concurrency_limit||20}</span></b></div>
      <div class="stat"><span>输入 tok</span><b>${fmt(u.input_tokens)}</b></div>
      <div class="stat"><span>输出 tok</span><b>${fmt(u.output_tokens)}</b></div>
    </div>
    <details class="more"${openIds.has(a.id)?" open":""}><summary>详细信息</summary><div class="more-box"><dl>
      <div><dt>账号 ID</dt><dd>${esc(a.id)}</dd></div>
      <div><dt>会话绑定</dt><dd>${a.bindings_count??0}</dd></div>
      <div><dt>最近使用</dt><dd>${u.last_used_at?ago(u.last_used_at):"—"}</dd></div>
      <div><dt>最近错误</dt><dd>${a.last_error?esc(a.last_error.code)+" · "+ago(a.last_error.at):"—"}</dd></div>
      <div><dt>并发上限</dt><dd>${a.learned_concurrency_limit||"未学习"}</dd></div>
      <div><dt>待验证</dt><dd>${a.verify_pending?"是":"否"}</dd></div>
    </dl></div></details>`;
    el.onclick=e=>{const b=e.target.closest("button");
      if(b){act(a,b.dataset.a,e);e.stopPropagation();return}
      // 详情区域的点击交给原生 <details> 开关：此处若 render() 会在默认
      // 切换动作生效前重建 DOM，旧节点被摘除导致永远关不上。
      if(e.target.closest("details.more"))return;
      sel=sel===a.id?null:a.id;render()};
    const det=el.querySelector("details.more");
    det.ontoggle=()=>{det.open?openIds.add(a.id):openIds.delete(a.id)};
    g.appendChild(el)
  }
}
function ago(iso){if(!iso)return"—";const s=(Date.now()-new Date(iso))/1e3;
  if(s<60)return Math.round(s)+"s 前";if(s<3600)return Math.round(s/60)+"m 前";if(s<86400)return Math.round(s/3600)+"h 前";return Math.round(s/86400)+"d 前"}
async function act(a,action,e){
  e&&e.stopPropagation();
  try{
    if(action==="u"&&!confirm("恢复 "+(a.label||a.id)+"？\n会清空该账号的限额窗口并重置宿主冷却。"))return;
    if(action==="u")await api("/account/unblock",{method:"POST",body:JSON.stringify({id:a.id})});
    if(action==="e")await api("/account",{method:"PATCH",body:JSON.stringify({id:a.id,enabled:a.enabled===false})});
    if(action==="x"){
      if(!confirm("删除账号 "+(a.label||a.id)+"？\n删除后不会再出现在本面板（CPA 里的登录文件仍保留，可在 CPA 中另行删除）。"))return;
      await api("/account?id="+encodeURIComponent(a.id)+"&purge=true",{method:"DELETE"});
      sel=null
    }
    await load()
  }catch(_){}
}
async function load(){
  try{
    const d=await api("/accounts");
    const j=JSON.stringify(d);
    // 数据未变且距上次渲染不足 60s：跳过重建（防 5s 轮询闪烁/折叠/跳序）
    if(j===lastJson&&Date.now()-lastRenderAt<60000)return;
    lastJson=j;lastRenderAt=Date.now();data=d;render()
  }catch(_){}
}
let pollMs=5000;
async function syncSettings(){
  try{const s=await api("/settings");const n=+s.panel_poll_seconds;if(n>=2&&n<=120)pollMs=n*1000}catch(_){}
}
function loop(){
  stopLoop();
  if(!key()){$("#keybar").classList.add("show");showErr("输入管理密钥后点「连接」");return}
  syncSettings().then(()=>{load();timer=setInterval(load,pollMs)})
}
$("#conn").onclick=()=>{localStorage.ocp_key=$("#key").value;$("#keybar").classList.remove("show");loop()};
$("#add").onclick=()=>{$("#modal").classList.add("open");$("#mname").focus()};
$("#mca").onclick=()=>$("#modal").classList.remove("open");
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("open")};
$("#mok").onclick=async()=>{
  const n=$("#mname").value.trim(),k=$("#mkey").value.trim();
  if(!k){showErr("API Key 不能为空");return}
  try{await api("/accounts",{method:"POST",body:JSON.stringify({name:n,api_key:k})});
    $("#modal").classList.remove("open");$("#mname").value="";$("#mkey").value="";await load()
  }catch(_){}
};
document.onkeydown=e=>{
  if($("#modal").classList.contains("open")){if(e.key==="Escape")$("#modal").classList.remove("open");if(e.key==="Enter")$("#mok").click();return}
  if(e.target.tagName==="INPUT")return;
  const cards=[...document.querySelectorAll(".acct")];if(!cards.length)return;
  const i=cards.findIndex(c=>c.classList.contains("sel"));
  if(e.key==="Escape"){sel=null;render();return}
  const n=e.key==="j"?(i<0?0:i+1):e.key==="k"?(i<0?0:i-1):i;
  if(e.key==="j"||e.key==="k"){const c=cards[Math.min(Math.max(n,0),cards.length-1)];sel=c.dataset.id;render();
    document.querySelector('.acct[data-id="'+CSS.escape(sel)+'"]')?.scrollIntoView({block:"nearest"});e.preventDefault();return}
  if(i>=0){const a=data.accounts.find(x=>x.id===cards[i].dataset.id);if(!a)return;
    if(e.key==="e")act(a,"e");if(e.key==="u")act(a,"u");if(e.key==="x")act(a,"x")}
};
loop();
</script>
</body>
</html>
